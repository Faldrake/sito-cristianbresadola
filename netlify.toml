# Netlify config - cristianbresadola.com
# Audit sicurezza 9/05/2026: aggiunti CSP, HSTS, COOP, CORP
# Aggiornamento 11/05/2026: CSP ampliato per Umami analytics (cloud.umami.is) + frame-src per Google Maps e YouTube
# Aggiornamento 11/05/2026 20:45: aggiunto api-gateway.umami.dev (beacon API Umami)
# Aggiornamento 02/08/2026: rimosso unpkg.com da script-src; Supabase ora si interroga via fetch sulle API REST, senza SDK esterno
# Aggiornamento 09/08/2026: redirect 301 per la copia rimossa alla radice; X-Robots-Tag allargato alle due forme dei pretty URL
# Aggiornamento 09/08/2026 (secondo): aggiunto gateway.umami.is a connect-src. MISURATO in produzione, non dedotto: la
#   console della pagina rifiutava «Connecting to https://gateway.umami.is/api/send violates ... connect-src», su ogni
#   pagina, perche' questa intestazione vale per tutto il sito. Umami ha spostato il beacon e la CSP era rimasta ai due
#   indirizzi vecchi: lo script si caricava (script-src lo consente), le visite non venivano contate. I due vecchi
#   restano finche' non si sa quale versione dello script serve quale indirizzo: toglierli adesso, senza quella
#   misura, rischierebbe di rompere di nuovo la stessa cosa dall'altro lato.

[build]
  publish = "."

# Pretty URLs: serve /contatti.html anche su /contatti
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# ============================================================
# REDIRECT
# ============================================================
# Alla radice viveva una copia dell'indice del Cerchio del Druido con il nome
# dell'articolo sulla prima seduta di riflessologia: il canonical puntava
# all'indice, ma chi aveva condiviso quell'indirizzo cercava l'articolo. La
# copia è stata rimossa e l'indirizzo porta all'articolo vero.
# force = true perché il 301 deve reggere anche se il file dovesse ricomparire:
# senza, un file omonimo tornerebbe a coprire la regola in silenzio.
[[redirects]]
  from = "/riflessologia-plantare-prima-seduta.html"
  to = "/cerchio-del-druido/riflessologia-plantare-prima-seduta.html"
  status = 301
  force = true

# Stessa rotta nella forma senza estensione servita dai pretty URL
[[redirects]]
  from = "/riflessologia-plantare-prima-seduta"
  to = "/cerchio-del-druido/riflessologia-plantare-prima-seduta.html"
  status = 301
  force = true

# ============================================================
# SECURITY HEADERS - applicati a tutte le pagine
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Forza HTTPS per 2 anni con preload (anti-MITM)
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    
    # Anti-clickjacking
    X-Frame-Options = "DENY"
    
    # Anti-MIME-sniffing
    X-Content-Type-Options = "nosniff"
    
    # Privacy: invia referrer solo a stesso dominio
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Restrizione API browser
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()"
    
    # Cross-origin isolation
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-site"
    
    # Content Security Policy - permette: self, font Google, immagini, connect Supabase+Umami, script Umami, frame Maps+YouTube
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://okasxfvoyihovohlaypz.supabase.co https://cloud.umami.is https://api-gateway.umami.dev https://gateway.umami.is; frame-src https://www.google.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.netlify.app https://cristianbresadola.com; object-src 'none'; upgrade-insecure-requests"

# ============================================================
# CACHE - asset statici cache lunga (immutable)
# ============================================================
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# PAGES SPECIFICHE
# ============================================================
# I pretty URL servono ogni pagina in due forme (/grazie e /grazie.html): una
# regola scritta sul solo nome col suffisso lascia l'altra forma senza header,
# e il noindex resta affidato al solo meta della pagina.
#
# LE DUE FORME SI SCRIVONO PER ESTESO, e non con un asterisco parziale: negli
# header di Netlify i glob documentati sono `/*` o `/cartella/*`, e un
# `/grazie*` (asterisco non preceduto da barra) non è una forma che la
# documentazione mostra. Se il matcher non la accettasse, la regola tacerebbe
# senza dirlo, che è il modo peggiore di sbagliare. Due blocchi espliciti
# costano quattro righe e non lasciano dubbi.

# Pagina disiscrizione: noindex (le due forme servite dai pretty URL)
[[headers]]
  for = "/disiscritto.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/disiscritto"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Pagina grazie post-form: noindex (idem)
[[headers]]
  for = "/grazie.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/grazie"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
