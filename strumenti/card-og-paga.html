<!--
  TEMPLATE DELLE CARD OG DEI LINK DI PAGAMENTO (11/10/2026)
  Una card 1200x630 per servizio (?s=croce_maya | sinastria | miscela_bach |
  seduta | percorso | generica). Sono l'anteprima che WhatsApp e gli altri
  mostrano sotto https://cristianbresadola.com/paga/<id>, servite da
  netlify/edge-functions/paga.ts. Stessa famiglia della card dei kin
  (strumenti/card-og.html): petrolio, salt, Fraunces e DM Sans.

  PER RIGENERARLE (solo se cambia il disegno):
    1. servi la radice del sito in locale, es.  python3 -m http.server 8081
    2. per ogni servizio:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless=new --disable-gpu --hide-scrollbars \
         --window-size=1200,630 --force-device-scale-factor=2 --virtual-time-budget=8000 \
         --screenshot=/tmp/og-<s>.png "http://localhost:8081/strumenti/card-og-paga.html?s=<s>"
    3. riduci a 1200x630 jpeg:  sips -z 630 1200 -s format jpeg -s formatOptions 86 ...
  La cartella strumenti/ non e' servita in produzione (netlify.toml).
-->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --petrol:#1B3A3E; --petrol-dark:#12282B; --forest:#2D5139;
    --salt:#E59856; --ivory:#EEF3F6; --frost:#DBE7EC; --sage:#8A9B86;
    --display:'Fraunces','Iowan Old Style',Georgia,serif;
    --body:'DM Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  .card{
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:
      radial-gradient(680px 560px at 72% 46%, rgba(45,81,57,.55), transparent 60%),
      linear-gradient(158deg, var(--petrol) 0%, var(--petrol-dark) 82%);
    color:var(--ivory); font-family:var(--body);
  }
  .stelle{position:absolute; inset:0; opacity:.55;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 18%, rgba(238,243,246,.7), transparent),
      radial-gradient(1px 1px at 33% 72%, rgba(238,243,246,.5), transparent),
      radial-gradient(1.4px 1.4px at 58% 12%, rgba(229,152,86,.7), transparent),
      radial-gradient(1px 1px at 86% 82%, rgba(238,243,246,.6), transparent),
      radial-gradient(1.2px 1.2px at 92% 22%, rgba(238,243,246,.5), transparent),
      radial-gradient(1px 1px at 46% 90%, rgba(229,152,86,.5), transparent),
      radial-gradient(1.3px 1.3px at 22% 48%, rgba(238,243,246,.4), transparent);}
  .shaft{
    position:absolute; top:-8%; left:74%; width:240px; height:130%;
    transform:translateX(-50%) rotate(6deg);
    background:linear-gradient(to bottom, rgba(229,152,86,.22), rgba(219,231,236,.05) 42%, transparent 72%);
    filter:blur(20px); opacity:.7;
  }
  .alone{
    position:absolute; top:44%; left:76%; width:460px; height:460px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(219,231,236,.14) 0%, rgba(229,152,86,.10) 36%, transparent 62%);
  }
  .portale{
    position:absolute; top:44%; left:76%; width:350px; height:350px;
    transform:translate(-50%,-50%); border-radius:50%; overflow:hidden;
    display:grid; place-items:center;
    background:radial-gradient(circle at 50% 42%, #16332F 0%, #0C1F22 66%, #08181A 100%);
    box-shadow:0 0 0 2px rgba(229,152,86,.8), 0 0 0 12px rgba(18,40,43,.72),
               0 0 0 13px rgba(229,152,86,.25),
               0 24px 70px rgba(0,0,0,.45), inset 0 0 60px rgba(0,0,0,.45);
  }
  .portale img.foto{width:100%; height:100%; object-fit:cover; filter:saturate(.92) brightness(.92)}
  .portale img.glifo{width:268px; height:268px; object-fit:contain; filter:sepia(1) saturate(2.4) hue-rotate(-12deg) brightness(1.05)}
  .portale::after{content:''; position:absolute; inset:0; border-radius:50%;
    box-shadow:inset 0 0 70px rgba(8,24,26,.55)}

  .contenuto{position:absolute; inset:0; padding:64px 76px; display:flex; flex-direction:column; z-index:3}
  .eyebrow{font-weight:500; font-size:18px; letter-spacing:.32em; text-transform:uppercase; color:var(--salt)}
  .centro{margin-top:auto; margin-bottom:auto; max-width:560px}
  .titolo{font-family:var(--display); font-weight:330; font-size:76px; line-height:1.02; letter-spacing:-.01em}
  .titolo em{display:block; font-style:italic; color:var(--salt)}
  .filo{width:64px; height:2px; background:var(--salt); margin:30px 0 24px; border-radius:2px}
  .frase{font-family:var(--display); font-style:italic; font-weight:330; font-size:28px; line-height:1.3; color:var(--frost); max-width:520px}
  .footer{display:flex; justify-content:space-between; align-items:flex-end; font-size:19px; letter-spacing:.04em}
  .marchio{color:var(--frost); opacity:.85; line-height:1.4}
  .marchio b{color:var(--ivory); font-weight:500}
  .marchio small{display:block; font-size:14px; opacity:.75; letter-spacing:.02em}
  .cta{font-weight:500; font-size:20px; color:var(--petrol-dark); background:var(--salt);
       padding:14px 30px; border-radius:100px; box-shadow:0 10px 34px rgba(0,0,0,.32); white-space:nowrap}
</style>
</head>
<body>
  <div class="card">
    <div class="stelle" aria-hidden="true"></div>
    <div class="shaft" aria-hidden="true"></div>
    <div class="alone" aria-hidden="true"></div>
    <div class="portale"><img id="img" alt=""></div>
    <div class="contenuto">
      <div class="eyebrow">Cristian Bresadola · Naturopata</div>
      <div class="centro">
        <div class="titolo" id="titolo"></div>
        <div class="filo" aria-hidden="true"></div>
        <div class="frase" id="frase"></div>
      </div>
      <div class="footer">
        <span class="marchio"><b>Pagamento sicuro con carta</b><small>cristianbresadola.com · In Lak'ech</small></span>
        <span class="cta">Apri e paga →</span>
      </div>
    </div>
  </div>
<script>
  const CARTE = {
    croce_maya:   {t:'La tua Lettura', e:'della Croce Maya', f:'Cinque glifi, una mappa: la luce che porti e la strada che ti aspetta.', img:'/images/croce-maya-glifi.webp', tipo:'foto'},
    sinastria:    {t:'La vostra', e:'Sinastria', f:'Due croci che si incontrano: quello che vi unisce e quello che vi chiede.', img:'/images/hunab-ku.png', tipo:'glifo'},
    miscela_bach: {t:'La tua miscela', e:'di fiori di Bach', f:'Gocce scelte per te, una alla volta, per accompagnare questo tempo.', img:'/images/floriterapia-fiori-quadrata.webp', tipo:'foto'},
    seduta:       {t:'La tua', e:'seduta', f:'Un tempo tutto per te: mani, respiro e ascolto.', img:'/images/cristian-mani-trattamento-quadrata.webp', tipo:'foto'},
    percorso:     {t:'Il tuo', e:'percorso', f:'Un cammino costruito insieme, passo dopo passo.', img:'/images/erbe-nel-mortaio.webp', tipo:'foto'},
    generica:     {t:'Il tuo', e:'pagamento', f:'Un link sicuro, preparato per te.', img:'/images/hunab-ku.png', tipo:'glifo'},
  };
  const s = new URLSearchParams(location.search).get('s') || 'generica';
  const c = CARTE[s] || CARTE.generica;
  document.getElementById('titolo').innerHTML = c.t + '<em>' + c.e + '</em>';
  document.getElementById('frase').textContent = c.f;
  const img = document.getElementById('img');
  img.className = c.tipo; img.src = c.img;
</script>
</body>
</html>
